name: Download test archive
description: >
  Downloads a nextest archive with retries, so a transient artifact-API failure does not fail
  an otherwise healthy test shard.

# Short-lived shards were dying in 11-14 seconds with
# `Unable to download artifact(s): ListArtifacts ... 403 Forbidden`, before running a single
# test, while sibling shards of the same matrix passed (issue #939). That is the artifact API
# refusing one request, not a product regression, and the run it kills has already spent a full
# build on the archive it was about to use.
#
# actions/download-artifact has no retry of its own, so the attempts are spelled out. Three of
# them with a growing pause: one 403 is the whole failure mode, and a second consecutive one
# usually means the artifact really is gone rather than momentarily unreachable. The last
# attempt does NOT continue on error, so a genuinely missing archive still fails the job with
# the action's own message.

inputs:
  name:
    description: Artifact name to download
    required: true
  path:
    description: Directory to extract the artifact into
    required: true

runs:
  using: composite
  steps:
    - id: first
      uses: actions/download-artifact@v4
      continue-on-error: true
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}

    - if: steps.first.outcome == 'failure'
      shell: bash
      run: |
        echo "::warning title=Artifact download retried::${{ inputs.name }} failed to download; retrying in 15s"
        sleep 15

    - id: second
      if: steps.first.outcome == 'failure'
      uses: actions/download-artifact@v4
      continue-on-error: true
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}

    - if: steps.first.outcome == 'failure' && steps.second.outcome == 'failure'
      shell: bash
      run: |
        echo "::warning title=Artifact download retried::${{ inputs.name }} failed twice; retrying in 45s"
        sleep 45

    - if: steps.first.outcome == 'failure' && steps.second.outcome == 'failure'
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
